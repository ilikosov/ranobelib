name: Release

on:
  push:
    tags: ["v*"]
  # Запуск из workflow tag-on-merge (пуш тега токеном GITHUB_TOKEN
  # не триггерит workflow сам по себе). Запускать с ref = тег релиза.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Сборка и публикация релиза
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Тесты
        run: go test -race -count=1 ./...

      - name: Кросс-компиляция
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            export GOOS GOARCH
            bin="ranobelib"
            ext=""
            [ "$GOOS" = "windows" ] && { bin="ranobelib.exe"; ext=".exe"; }
            go build -trimpath -ldflags "-s -w" -o "$bin" .
            name="ranobelib_${version}_${GOOS}_${GOARCH}"
            # Архив с README и отдельный бинарник для прямого скачивания.
            if [ "$GOOS" = "windows" ]; then
              zip -q "dist/${name}.zip" "$bin" README.md
            else
              tar -czf "dist/${name}.tar.gz" "$bin" README.md
            fi
            mv "$bin" "dist/${name}${ext}"
          done
          ls -l dist/

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
